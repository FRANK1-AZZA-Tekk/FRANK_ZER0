[env:twatch_s3_plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Escopo estrito: somente relogio, Wi-Fi, LCD e HTTP.
; A tela usa TFT_eSPI; ajuste pinos em User_Setup se seu painel exigir.
lib_deps =
  bodmer/TFT_eSPI
  bblanchon/ArduinoJson

build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=11
  -D TFT_RST=9
  -D TFT_BL=38
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SPI_FREQUENCY=40000000
