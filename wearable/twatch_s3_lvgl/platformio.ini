[env:twatch_s3_lvgl]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; HUD LVGL v9 para LilyGO T-Watch S3 Plus.
; Mantem o firmware pequeno: display, touch, Wi-Fi e MQTT.
lib_deps =
  lvgl/lvgl@^9.2.2
  khoih-prog/AsyncMQTT_ESP32
  bblanchon/ArduinoJson
  bodmer/TFT_eSPI
  https://github.com/Xinyuan-LilyGO/LilyGoLib.git

build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=11
  -D TFT_RST=9
  -D TFT_BL=38
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SPI_FREQUENCY=40000000
  -D LV_CONF_INCLUDE_SIMPLE=1
  -D LV_COLOR_DEPTH=16
